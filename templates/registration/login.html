{% extends "base.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}
  <h1>Logowanie</h1>

  <form class="form" method="post">
    {% csrf_token %}
    {# {{ form }} renders non_field_errors itself, at the top, as <ul class="errorlist nonfield">. #}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Zaloguj</button>
  </form>
{% endblock %}
