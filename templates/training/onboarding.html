{% extends "base.html" %}

{% block title %}Set up your profile{% endblock %}

{% block content %}
  <h1>Set up your profile</h1>

  <p>Your training plans are built from these details.</p>

  <form class="form" method="post">
    {% csrf_token %}
    {# {{ form }} renders non_field_errors itself, at the top, as <ul class="errorlist nonfield">. #}
    {{ form }}
    <button type="submit">Save profile</button>
  </form>
{% endblock %}
